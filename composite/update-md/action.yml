name: 'Update Markdown Index'
description: 'Automatically generates and updates README.md indexes for reusable workflows and composite actions'
inputs:
  workflow-dir:
    description: 'Directory containing reusable workflows'
    required: false
    default: '.github/workflows'
  composite-dir:
    description: 'Directory containing composite actions'
    required: false
    default: 'composite'
  readme-path:
    description: 'Path to the README.md file to update'
    required: false
    default: 'README.md'
runs:
  using: 'composite'
  steps:
    - name: Generate README index
      shell: bash
      env:
        INPUT_WORKFLOW_DIR: ${{ inputs.workflow-dir }}
        INPUT_COMPOSITE_DIR: ${{ inputs.composite-dir }}
        INPUT_README_PATH: ${{ inputs.readme-path }}
      run: |
        set -e

        PROJECT_ROOT="${GITHUB_WORKSPACE}"

        validate_workspace_relative_path() {
          local input_name="$1"
          local input_path="$2"

          if [ -z "$input_path" ]; then
            echo "$input_name must not be empty." >&2
            exit 1
          fi

          case "$input_path" in
            /*|..|../*|*/..|*/../*)
              echo "$input_name must be relative to the workspace and must not contain '..' segments: $input_path" >&2
              exit 1
              ;;
          esac
        }

        validate_workspace_relative_path "workflow-dir" "$INPUT_WORKFLOW_DIR"
        validate_workspace_relative_path "composite-dir" "$INPUT_COMPOSITE_DIR"
        validate_workspace_relative_path "readme-path" "$INPUT_README_PATH"

        WORKFLOW_DIR="${PROJECT_ROOT}/${INPUT_WORKFLOW_DIR}"
        COMPOSITE_DIR="${PROJECT_ROOT}/${INPUT_COMPOSITE_DIR}"
        README_PATH="${PROJECT_ROOT}/${INPUT_README_PATH}"
        TEMP_ROOT="${RUNNER_TEMP:-${TMPDIR:-.}}"
        reusable_entries=""

        cleanup_temp_files() {
          [ -z "${reusable_entries:-}" ] || rm -f "$reusable_entries"
        }
        trap cleanup_temp_files EXIT

        # Generate the top section of README
        README_TOP=$(cat <<- 'EOF'
        # gh-actions

        A centralized repository for reusable GitHub Actions workflows and composite actions. These actions and workflows can be referenced from any GitHub Actions workflow in any repository.

        EOF
        )

        # Start building the new README
        mkdir -p "$(dirname "$README_PATH")"
        echo "$README_TOP" > "$README_PATH"
        echo "" >> "$README_PATH"

        # Find reusable workflows with workflow_call triggers.
        if [ -d "$WORKFLOW_DIR" ]; then
          reusable_count=0
          reusable_entries="$(mktemp "$TEMP_ROOT/update-md-reusable.XXXXXX")"

          while IFS= read -r workflow_file; do
            if ! grep -Eq '^[[:space:]]*workflow_call:' "$workflow_file"; then
              continue
            fi

            workflow_name="$(
              sed -n 's/^name:[[:space:]]*//p' "$workflow_file" |
                head -1 |
                sed -e 's/^["'\'']//; s/["'\'']$//'
            )"
            if [ -z "$workflow_name" ]; then
              workflow_name="$(basename "$workflow_file")"
            fi

            workflow_description="$(
              sed -n 's/^# Description:[[:space:]]*//p' "$workflow_file" |
                head -1
            )"

            workflow_rel="${workflow_file#"$PROJECT_ROOT"/}"
            workflow_doc="${workflow_file%.yml}.md"
            workflow_link="$workflow_rel"
            if [ -f "$workflow_doc" ]; then
              workflow_link="${workflow_doc#"$PROJECT_ROOT"/}"
            fi
            {
              echo "   - 📄 [$workflow_name](./$workflow_link)"
              if [ -n "$workflow_description" ]; then
                echo "      - _${workflow_description}_"
              fi
            } >> "$reusable_entries"
            reusable_count=$((reusable_count + 1))
          done < <(find "$WORKFLOW_DIR" -maxdepth 1 -type f -name '*.yml' ! -name '_*.yml' | sort)

          if [ "$reusable_count" -gt 0 ]; then
            {
              echo "## Reusable Workflows Index"
              echo "- 📂 __${INPUT_WORKFLOW_DIR}__"
              cat "$reusable_entries"
              echo ""
            } >> "$README_PATH"
          fi
        fi

        echo "## Composite Actions Index" >> "$README_PATH"

        # Find all action directories (excluding hidden files and directories)
        if [ -d "$COMPOSITE_DIR" ]; then
          echo "- 📂 __${INPUT_COMPOSITE_DIR}__" >> "$README_PATH"
          while IFS= read -r action_dir; do
            action_rel="${action_dir#"$PROJECT_ROOT"/}"
            readme_file="$action_dir/README.md"

            if [ -f "$readme_file" ]; then
              # Extract the title (H1)
              title=$(grep -m 1 '^# ' "$readme_file" | sed 's/^# //')

              # Extract the description (content after ## Description)
              description=$(sed -n '/^## Description$/,/^## /{ /^## Description$/d; /^## /d; p; }' "$readme_file" | sed '/^$/d' | head -1)

              # Write the entry in file tree format
              echo "   - 📄 [$title](./$action_rel/)" >> "$README_PATH"
              if [ -n "$description" ]; then
                echo "      - _${description}_" >> "$README_PATH"
              fi
            fi
          done < <(find "$COMPOSITE_DIR" -mindepth 1 -maxdepth 1 -type d | sort)
        fi

        echo "README.md has been updated successfully!"
