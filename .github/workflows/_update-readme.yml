# Description: Regenerates this repository's README index from its documented workflows and actions.
name: Update README Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.md'
      - 'composite/update-md/**'
      - 'composite/**/README.md'
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Update README.md
        uses: ./composite/update-md
        with:
          title: 'gh-actions'
          description: 'A centralized repository for reusable GitHub Actions workflows and composite actions. These actions and workflows can be referenced from any GitHub Actions workflow in any repository.'
          sections: |
            [
              {
                "title": "Workflows Index",
                "path": ".github/workflows",
                "kind": "files",
                "include": ["*.yml"],
                "exclude": ["_*.yml"],
                "contains": "^[[:space:]]*workflow_call:",
                "include-without-content": ["ruleset-*.yml"],
                "title-pattern": "^name:[[:blank:]]*(.*)$",
                "strip-title-quotes": true,
                "description-pattern": "^# Description:[[:blank:]]*(.*)$",
                "doc-extension": ".md"
              },
              {
                "title": "Composite Actions Index",
                "path": "composite",
                "kind": "directories",
                "metadata-file": "README.md",
                "title-pattern": "^# +(.+)$",
                "description-heading": "Description",
                "skip-empty": false
              }
            ]
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update README.md index"
            git push
          fi
