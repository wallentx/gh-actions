name: 'Setup Environment'
description: 'A composite action to set up common environment variables and tools'
inputs:
  node-version:
    description: 'Node.js version to setup'
    required: false
    default: '20'
  cache-dependency-path:
    description: 'Path to dependency file for caching'
    required: false
    default: 'package-lock.json'
outputs:
  timestamp:
    description: 'Timestamp when the action was run'
    value: ${{ steps.set-timestamp.outputs.timestamp }}
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    
    - name: Set timestamp
      id: set-timestamp
      shell: bash
      run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
    
    - name: Display environment info
      shell: bash
      run: |
        echo "=== Environment Information ==="
        echo "Node version: $(node --version || echo 'not installed')"
        echo "NPM version: $(npm --version || echo 'not installed')"
        echo "Runner OS: ${{ runner.os }}"
        echo "Timestamp: ${{ steps.set-timestamp.outputs.timestamp }}"
