name: 'Update Markdown Index'
description: 'Automatically generates and updates README.md indexes for reusable workflows and composite actions'
inputs:
  title:
    description: 'README title, without the Markdown heading prefix; empty omits the title'
    required: false
    default: ''
  title-template:
    description: 'Template for the README title; supports {title}'
    required: false
    default: '# {title}'
  description:
    description: 'Markdown description below the title'
    required: false
    default: ''
  header:
    description: 'Additional Markdown before the generated sections'
    required: false
    default: ''
  footer:
    description: 'Additional Markdown after the generated sections'
    required: false
    default: ''
  sections:
    description: 'JSON array of index sections; use [] for a document with only custom text'
    required: false
    default: |
      [
        {
          "title": "Workflows Index",
          "path": "{workflow-dir}",
          "kind": "files",
          "include": ["*.yml"],
          "exclude": ["_*.yml"],
          "contains": "^[[:space:]]*workflow_call:",
          "include-without-content": ["ruleset-*.yml"],
          "title-pattern": "^name:[[:blank:]]*(.*)$",
          "strip-title-quotes": true,
          "description-pattern": "^# Description:[[:blank:]]*(.*)$",
          "doc-extension": ".md"
        },
        {
          "title": "Composite Actions Index",
          "path": "{composite-dir}",
          "kind": "directories",
          "metadata-file": "README.md",
          "title-pattern": "^# +(.+)$",
          "description-heading": "Description",
          "skip-empty": false
        }
      ]
  section-template:
    description: 'Template for section headings; supports {title} and {path}'
    required: false
    default: '## {title}'
  directory-template:
    description: 'Template for the directory row; supports {icon}, {path}, {title}, and {link}'
    required: false
    default: '- {icon} __{path}__'
  entry-template:
    description: 'Template for each entry; supports {icon}, {title}, {path}, {link}, and {description}'
    required: false
    default: '   - {icon} [{title}]({link})'
  description-template:
    description: 'Template below entries with descriptions; empty disables description rows'
    required: false
    default: '      - _{description}_'
  directory-icon:
    description: 'Directory icon; may be empty or plain text'
    required: false
    default: '📂'
  file-icon:
    description: 'Entry icon; may be empty or plain text'
    required: false
    default: '📄'
  workflow-dir:
    description: 'Workspace-relative directory used by {workflow-dir} in sections'
    required: false
    default: '.github/workflows'
  composite-dir:
    description: 'Workspace-relative directory used by {composite-dir} in sections'
    required: false
    default: 'composite'
  readme-path:
    description: 'Workspace-relative path to the Markdown file to generate'
    required: false
    default: 'README.md'
runs:
  using: 'composite'
  steps:
    - name: Generate README index
      shell: bash
      env:
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_TITLE_TEMPLATE: ${{ inputs.title-template }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        INPUT_HEADER: ${{ inputs.header }}
        INPUT_FOOTER: ${{ inputs.footer }}
        INPUT_SECTIONS: ${{ inputs.sections }}
        INPUT_SECTION_TEMPLATE: ${{ inputs.section-template }}
        INPUT_DIRECTORY_TEMPLATE: ${{ inputs.directory-template }}
        INPUT_ENTRY_TEMPLATE: ${{ inputs.entry-template }}
        INPUT_DESCRIPTION_TEMPLATE: ${{ inputs.description-template }}
        INPUT_DIRECTORY_ICON: ${{ inputs.directory-icon }}
        INPUT_FILE_ICON: ${{ inputs.file-icon }}
        INPUT_WORKFLOW_DIR: ${{ inputs.workflow-dir }}
        INPUT_COMPOSITE_DIR: ${{ inputs.composite-dir }}
        INPUT_README_PATH: ${{ inputs.readme-path }}
      run: |
        "${GITHUB_ACTION_PATH}/scripts/generate_readme.sh"
